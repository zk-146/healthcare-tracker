# Production stack for a single host. Run from the repository root:
#
#   cp deploy/env.prod.example deploy/.env.prod      # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
# What is different from the dev docker-compose.yml, and why:
#   - The app runs with SPRING_PROFILES_ACTIVE=prod, so it refuses to start on any secret
#     that ships in this repository and uses the production rate limits.
#   - Every secret is required (${VAR:?...}); there are no fallback defaults.
#   - Only Caddy publishes ports (80/443, automatic HTTPS). PostgreSQL, Redis and Kafka sit
#     on an internal network with no route in from outside and none out.
#   - No kafka-ui, and Ollama/Prometheus are opt-in profiles.
#
# This is one instance of the app. See deploy/RUNBOOK.md before running more than one.
name: activity-tracker

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname, e.g. tracker.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account. Losing this volume means re-issuing certificates,
      # and Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Fixed address: the app trusts X-Forwarded-For only from exactly this peer
        # (TRUSTED_PROXIES below). Keep the two in step.
        ipv4_address: 172.28.0.2
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ..
    image: activity-tracker:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/activity_tracker?preferQueryMode=simple
      SPRING_DATASOURCE_USERNAME: activity_tracker
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -base64 48)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (openssl rand -base64 48)}
      GOOGLE_HEALTH_TOKEN_KEY: ${GOOGLE_HEALTH_TOKEN_KEY:?Set GOOGLE_HEALTH_TOKEN_KEY (openssl rand -base64 32)}
      # Health and metrics are served here, not on 8080. This port is not published and
      # Caddy does not proxy to it, so it is reachable only from inside the networks below.
      MANAGEMENT_PORT: 9090
      # Caddy's fixed address on the edge network; see the caddy service.
      TRUSTED_PROXIES: 172.28.0.2
      CORS_ORIGINS: https://${DOMAIN}
      # Links in password-reset and verification emails are built on this.
      PUBLIC_BASE_URL: https://${DOMAIN}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM to the address emails are sent from}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST (or MAIL_ENABLED=false to run without email)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # AI features are off unless chosen: "deepseek" sends workout notes to DeepSeek's API
      # using each user's own key; "ollama" needs the ollama profile below and a GPU.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      GOOGLE_HEALTH_ENABLED: ${GOOGLE_HEALTH_ENABLED:-false}
      GOOGLE_HEALTH_CLIENT_ID: ${GOOGLE_HEALTH_CLIENT_ID:-}
      GOOGLE_HEALTH_CLIENT_SECRET: ${GOOGLE_HEALTH_CLIENT_SECRET:-}
      GOOGLE_HEALTH_REDIRECT_URI: https://${DOMAIN}/api/v1/integrations/google-health/callback
      # Size the heap from the container's memory limit rather than the host's RAM.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    # The process needs to write nowhere but /tmp (Tomcat work dir, multipart uploads).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Readiness = the app is up and can reach PostgreSQL. Uses bash's /dev/tcp so it does
      # not depend on curl or wget being present in the runtime image.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9090 &&
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: activity_tracker
      POSTGRES_USER: activity_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activity_tracker -d activity_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    # noeviction, unlike the dev stack's allkeys-lru: this Redis holds revoked-token and
    # login-lockout entries, and evicting one silently un-revokes a token. Every key has a
    # TTL, so it empties itself; if it ever does fill, writes fail loudly instead.
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Plaintext and unauthenticated. Acceptable only because the broker is on the
      # internal backend network with nothing published; do not expose 9092.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Opt-in: --profile monitoring. Scrapes the app's management port and evaluates
  # deploy/prometheus/alerts.yml. The UI is bound to localhost on the host only; reach it
  # over an SSH tunnel. It has no login of its own.
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - backend
      - edge

  # Opt-in: --profile ollama, with AI_PROVIDER=ollama and OLLAMA_ENABLED=true. Needs an
  # NVIDIA GPU and the NVIDIA container toolkit. Pull the model once after starting:
  #   docker compose ... exec ollama ollama pull "$OLLAMA_MODEL"
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - backend
      # Needs a route out to download models.
      - edge

networks:
  # Has a route to the internet: Caddy for inbound traffic and ACME, the app for outbound
  # SMTP and (if enabled) the DeepSeek and Google APIs.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # No route in or out. Data stores live only here.
  backend:
    internal: true

volumes:
  postgres-data:
  kafka-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  ollama-models:
