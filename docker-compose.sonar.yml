# Local code-quality analysis. Deliberately separate from docker-compose.yml so a
# normal `docker compose up` does not also start a ~2 GB analysis server. Nothing
# here is shared with the application stack: its own Postgres, its own volumes.
#
# Requires vm.max_map_count >= 262144 on the Docker host for the embedded
# Elasticsearch. See SONARQUBE.md if the server exits during startup.

services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    networks:
      - sonar-net
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Separate from the application Postgres on purpose: sharing would couple the
  # app's data lifecycle to a tool that gets torn down and rebuilt freely.
  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - sonar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  sonar-db-data:

networks:
  sonar-net:
    # Explicit name so the scanner container can join it with `--network sonar-net`
    # regardless of the compose project prefix.
    name: sonar-net
