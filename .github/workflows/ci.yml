name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can catch a secret introduced in an earlier
          # commit and later "removed" (still present in history either way).
          fetch-depth: 0

      # Run the OSS gitleaks CLI directly via its Docker image, rather than the
      # zricethezav/gitleaks-action wrapper, to avoid that action's licensing
      # requirements for private repos.
      - name: Run gitleaks
        run: |
          mkdir -p gitleaks-report
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --report-format sarif \
              --report-path /repo/gitleaks-report/gitleaks.sarif \
              --redact \
              --verbose

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report/gitleaks.sarif

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: mvn verify -B

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

      # The Java dependency scan and Trivy image scan do not cover the npm tree.
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high --omit=dev

  owasp:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # setup-java's maven cache only saves on a miss, and build/codeql share its key, so
      # they win the race and this job's freshly downloaded NVD database was never persisted
      # -- a full ~390k-CVE pull on every run. A dedicated cache keyed on run_id always
      # misses (so it always saves) while restore-keys brings back the newest prior copy,
      # leaving dependency-check an incremental delta to fetch.
      - name: Restore NVD database
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # Enforcing: fails the job on any dependency with CVSS >= 7
      # (failBuildOnCVSS=7 configured in pom.xml)
      - name: OWASP Dependency Check
        run: mvn dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      # Split from the restore deliberately. actions/cache skips its save step when the job
      # has failed, and this job fails by design whenever a CVE breaches the threshold -- so
      # a combined cache action would never persist the database on exactly the runs that
      # are red, leaving every one of them to re-download all ~390k CVEs.
      - name: Save NVD database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html

  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required to publish results to the Security tab.
      security-events: write

    strategy:
      # One language failing should not hide the other language's results.
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Build for CodeQL
        if: matrix.language == 'java'
        run: mvn compile -B

      # Results are uploaded to code scanning rather than written only to an artifact.
      # With `upload: never` a finding of any severity still produced a green check, so the
      # job could not surface anything it found.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results

      - name: Upload CodeQL SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results/*.sarif

  docker:
    needs: [build, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t activity-tracker:${{ github.sha }} .

      # Enforcing: fails the job on CRITICAL vulnerabilities; HIGH is reported below
      # (SARIF artifact) without failing the build. Confirmed false positives / accepted
      # findings go in .trivyignore (see that file for the format and policy) rather than
      # loosening this gate.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-tracker:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-tracker:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  # DAST: runs the app for real (Postgres only -- Redis/Kafka/Ollama are all
  # optional at startup, see application.yml) and points an OWASP ZAP baseline
  # scan at it. Passive only (no attack payloads): flags things only visible at
  # runtime -- missing security headers, cookie flags, verbose error responses --
  # that SAST/dependency scanning can't see.
  #
  # Advisory for now (does not fail the build): this is the first pass, and the
  # findings need triaging into a baseline ignore file before this gates merges,
  # the same way OWASP/Trivy do via dependency-check-suppressions.xml/.trivyignore.
  zap:
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: activity_tracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d activity_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Package (skip tests -- already run in the build job)
        run: mvn package -B -DskipTests

      - name: Start the app
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/activity_tracker?preferQueryMode=simple
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          JWT_SECRET: dev-secret-key-for-local-testing-must-be-at-least-32-chars
          JWT_REFRESH_SECRET: dev-refresh-secret-for-local-testing-at-least-32-chars
          # No Redis/Kafka/Ollama service in this job -- all three degrade gracefully at the
          # application level (see application.yml comments), but Boot's default health
          # aggregation still marks /actuator/health DOWN when Redis's auto-configured
          # indicator can't reach it, which would otherwise fail our own readiness wait below
          # despite the app being perfectly able to serve requests. (Kafka has no such health
          # indicator in this actuator version -- only Redis needs disabling.) There's also
          # no need to have Ollama or the outbox relay spin trying to reach services that
          # don't exist here.
          OLLAMA_ENABLED: 'false'
          OUTBOX_ENABLED: 'false'
          MANAGEMENT_HEALTH_REDIS_ENABLED: 'false'
        run: |
          nohup java -jar target/activity-tracker-*.jar > app.log 2>&1 &
          echo "Waiting for the app to come up..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time."
          cat app.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          # Not yet tuned to this app's expected 401/404 responses -- see comment above.
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report

      - name: Upload app log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-app-log
          path: app.log
