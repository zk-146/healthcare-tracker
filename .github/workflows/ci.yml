name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: mvn verify -B

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        run: npm run build

      # The Java dependency scan and Trivy image scan do not cover the npm tree.
      - name: Audit dependencies
        working-directory: ui
        run: npm audit --audit-level=high --omit=dev

  owasp:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # setup-java's maven cache only saves on a miss, and build/codeql share its key, so
      # they win the race and this job's freshly downloaded NVD database was never persisted
      # -- a full ~390k-CVE pull on every run. A dedicated cache keyed on run_id always
      # misses (so it always saves) while restore-keys brings back the newest prior copy,
      # leaving dependency-check an incremental delta to fetch.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # Enforcing: fails the job on any dependency with CVSS >= 7
      # (failBuildOnCVSS=7 configured in pom.xml)
      - name: OWASP Dependency Check
        run: mvn dependency-check:check -B -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html

  codeql:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Required to publish results to the Security tab.
      security-events: write

    strategy:
      # One language failing should not hide the other language's results.
      fail-fast: false
      matrix:
        language: [java, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Build for CodeQL
        if: matrix.language == 'java'
        run: mvn compile -B

      # Results are uploaded to code scanning rather than written only to an artifact.
      # With `upload: never` a finding of any severity still produced a green check, so the
      # job could not surface anything it found.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results

      - name: Upload CodeQL SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results/*.sarif

  docker:
    needs: [build, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t activity-tracker:${{ github.sha }} .

      # Enforcing: fails the job on CRITICAL vulnerabilities; HIGH is reported below
      # (SARIF artifact) without failing the build. Confirmed false positives / accepted
      # findings go in .trivyignore (see that file for the format and policy) rather than
      # loosening this gate.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-tracker:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: activity-tracker:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
