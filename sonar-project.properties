# Configuration for the standalone Sonar scanner CLI. Paths are relative to the
# repository root, which the scanner container mounts at /usr/src.
#
# Run it via scripts/sonar-scan.sh - that script produces the two coverage
# reports referenced below before invoking the scanner.

sonar.projectKey=healthcare-tracker
sonar.projectName=Healthcare Tracker
sonar.sourceEncoding=UTF-8

# One project covering both languages: the Spring Boot backend and the React UI.
sonar.sources=src/main/java,ui/src
sonar.tests=src/test/java

# Mandatory for Java analysis. Without compiled classes the scanner skips Java
# entirely rather than warning.
sonar.java.binaries=target/classes

# The dependency jars, so type resolution is precise. sonar-scan.sh populates
# target/dependency via `mvn dependency:copy-dependencies` before the scan;
# without this the scanner warns and a few type-sensitive Java rules degrade.
sonar.java.libraries=target/dependency/*.jar

sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# Frontend tests live beside the code they cover, so they are classified by
# filename rather than by directory.
sonar.test.inclusions=ui/src/**/*.test.ts,ui/src/**/*.test.tsx

sonar.exclusions=target/**,ui/node_modules/**,ui/dist/**,ui/coverage/**,src/main/resources/static/**,**/__pycache__/**,docs/**
