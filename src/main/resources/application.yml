spring:
  application:
    name: activity-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activity_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # If Redis is unavailable, the app falls back to in-memory stores.
      # Set timeout low so startup isn't blocked.
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: activity-tracker-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.healthcare.activitytracker.model.event
        spring.json.value.default.type: com.healthcare.activitytracker.model.event.ActivityCreatedEvent
    listener:
      ack-mode: record
      missing-topics-fatal: false

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  port: 8080
  # Limit maximum request body size at the Tomcat level
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

# Only expose the health endpoint; all others are disabled by default
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.healthcare.activitytracker: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:default-dev-refresh-secret-change-in-production-at-least-32-chars}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    issuer: activity-tracker
    audience: activity-tracker-users
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  rate-limit:
    # Safe-by-default limits so brute-force protection does not depend on the 'prod' profile
    # being active. The 'prod' profile tightens these further; 'test' loosens them.
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    api-requests-per-minute: ${RATE_LIMIT_API_PER_MINUTE:100}
  security:
    # Comma-separated list of trusted reverse-proxy IPs.
    # Only these IPs may set X-Forwarded-For. Leave empty to disable header trust.
    trusted-proxies: ${TRUSTED_PROXIES:}
  summary:
    max-range-days: 365
  kafka:
    topics:
      activity-events: activity-events
    consumer:
      group-id: activity-tracker-consumers
