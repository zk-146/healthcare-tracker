spring:
  application:
    name: activity-tracker

  datasource:
    # preferQueryMode=simple: ActivityRepository.findByFilters binds null enum/timestamp
    # parameters (the `:param IS NULL OR ...` idiom). Postgres cannot infer a type for a
    # null parameter in a server-side prepared statement and fails with
    # "could not determine data type of parameter $N". Simple query mode sends literals
    # instead, which sidesteps it at the cost of prepared-statement plan caching.
    # Removing this requires typing those nulls (explicit casts, or a Criteria query that
    # omits absent predicates) — do not drop it without doing that first.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/activity_tracker?preferQueryMode=simple}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # If Redis is unavailable, the app falls back to in-memory stores.
      # Set timeout low so startup isn't blocked.
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        # OutboxRelay.drain() sends from inside an open transaction holding FOR UPDATE locks on
        # the claimed rows, so the producer must never block on the Kafka defaults (60s/120s).
        # max.block.ms caps how long a single send() waits on metadata; delivery.timeout.ms
        # guarantees a send that got metadata eventually completes its future instead of hanging.
        # Kafka requires delivery.timeout.ms >= request.timeout.ms + linger.ms (30s + 0 by
        # default), which 15000 does not satisfy on paper — so request.timeout.ms is lowered to
        # match. 10s is ample for a local/in-cluster broker.
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    consumer:
      group-id: activity-tracker-consumers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.healthcare.activitytracker.model.event
        spring.json.value.default.type: com.healthcare.activitytracker.model.event.ActivityCreatedEvent
    listener:
      ack-mode: record
      missing-topics-fatal: false

  servlet:
    multipart:
      # Large enough for a Kaggle Fitbit dailyActivity_merged.csv export (single-digit MB).
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  # Limit maximum request body size at the Tomcat level
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB

# Only expose the health endpoint; all others are disabled by default
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.healthcare.activitytracker: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-key-change-in-production-must-be-at-least-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:default-dev-refresh-secret-change-in-production-at-least-32-chars}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    issuer: activity-tracker
    audience: activity-tracker-users
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
  rate-limit:
    auth-requests-per-minute: 300
    api-requests-per-minute: 1000
  security:
    # Comma-separated list of trusted reverse-proxy IPs.
    # Only these IPs may set X-Forwarded-For. Leave empty to disable header trust.
    trusted-proxies: ${TRUSTED_PROXIES:}
    login:
      # Per-account failed-login throttling. Rate limiting is keyed on client IP, which does
      # nothing against credential stuffing spread across many addresses; this counts against
      # the account being attacked instead. Distributed via Redis when it is available.
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
  summary:
    max-range-days: 365
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:14b}
    # Prose sampling temperature. JSON generations ignore this and always run at 0 + fixed seed.
    temperature: ${OLLAMA_TEMPERATURE:0.7}
    seed: ${OLLAMA_SEED:42}
    connect-timeout-ms: 3000
    read-timeout-ms: ${OLLAMA_READ_TIMEOUT_MS:120000}
  kafka:
    topics:
      activity-events: activity-events
    consumer:
      group-id: activity-tracker-consumers
  outbox:
    # Master switch for the relay. False leaves events accumulating in the table
    # unpublished — the same posture OLLAMA_ENABLED=false gives the AI layer.
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: 100
    max-attempts: 10
    send-timeout-ms: 10000
    retention-days: 7
    purge-interval-ms: 86400000
  integrations:
    google-health:
      # Master switch. Leave false until a Google Cloud OAuth client is configured.
      enabled: ${GOOGLE_HEALTH_ENABLED:false}
      client-id: ${GOOGLE_HEALTH_CLIENT_ID:}
      client-secret: ${GOOGLE_HEALTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_HEALTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/google-health/callback}
      # Passphrase used to encrypt stored OAuth tokens at rest. Override in any real deployment.
      token-encryption-key: ${GOOGLE_HEALTH_TOKEN_KEY:change-me-token-encryption-key}
      device-label: fitbit-charge-6
      # How often the background sync polls Google Health (ms). Default: 1 hour.
      poll-interval-ms: ${GOOGLE_HEALTH_POLL_INTERVAL_MS:3600000}
      initial-delay-ms: 60000
      initial-backfill-days: 30
