# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
# All secrets MUST be provided via environment variables (no defaults).

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

logging:
  level:
    root: WARN
    com.healthcare.activitytracker: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
  rate-limit:
    auth-requests-per-minute: 10
    api-requests-per-minute: 60
  security:
    login:
      max-failed-attempts: 5
      lock-duration-minutes: 15
