# Gitleaks config for this repo. Extends the default ruleset (secret patterns,
# entropy checks) and allowlists the handful of known non-secret placeholders
# that would otherwise trip it.
title = "activity-tracker gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known non-secret placeholders"
regexes = [
  # Documented dev-only fallback defaults (${VAR:default} syntax) — never used
  # outside local/dev; application-prod.yml requires the real env var with no
  # default. Long/descriptive on purpose so a real deployment can't miss
  # rotating them, which is exactly what makes them look secret-shaped here.
  '''default-dev-secret-key-change-in-production-must-be-at-least-32-chars''',
  '''default-dev-refresh-secret-change-in-production-at-least-32-chars''',
  '''dev-secret-key-for-local-testing-must-be-at-least-32-chars''',
  '''dev-refresh-secret-for-local-testing-at-least-32-chars''',
  '''redis-local-dev-password''',
  '''change-me-token-encryption-key''',
  # scripts/sonar-scan.sh:96 -- `curl -u "$SONAR_TOKEN:"` passes the token via a shell
  # variable, not a hardcoded credential. The default curl-auth-user rule flags any
  # `curl -u <value>` regardless of whether <value> is a literal or a variable reference.
  '''\$SONAR_TOKEN:?''',
]
paths = [
  # Test fixtures intentionally use fake keys/tokens to exercise the JWT/OAuth code paths.
  '''src/test/.*''',
]
